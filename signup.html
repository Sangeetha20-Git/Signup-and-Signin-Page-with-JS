<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">

            <section class="auth-card">

                <header>
                    <h2 class="text-center">Create Account</h2>
                </header>

                <form id="signupForm" novalidate>

                    <div class="row">

                        <div class="col-md-6 mb-2">
                            <input type="text" id="fullname" class="form-control" placeholder="Full Name">
                            <small class="error" id="nameError"></small>
                        </div>

                        <div class="col-md-6 mb-2">
                            <input type="email" id="email" class="form-control" placeholder="Email">
                            <small class="error" id="emailError"></small>
                        </div>

                        <div class="col-md-6 mb-2">
                            <input type="tel" id="phone" class="form-control" placeholder="Phone Number">
                            <small class="error" id="phoneError"></small>
                        </div>

                        <div class="col-md-6 mb-2">
                            <input type="text" id="city" class="form-control" placeholder="City">
                            <small class="error" id="cityError"></small>
                        </div>

                    </div>

                    <div class="input-group mb-2">
                        <input type="password" id="password" class="form-control" placeholder="Password">
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password')">
                            Show
                        </button>
                    </div>
                    <small class="error" id="passwordError"></small>

                    <div class="input-group mb-2">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password">
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword')">
                            Show
                        </button>
                    </div>
                    <small class="error" id="confirmError"></small>

                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        Sign Up
                    </button>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="signin.html">Sign In</a>
                    </p>

                </form>

            </section>

        </div>
    </div>
</main>

<script src="js/signup.js"></script>

</body>
</html>
